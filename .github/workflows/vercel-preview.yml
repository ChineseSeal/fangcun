name: Vercel Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      preview_url:
        description: Protected Vercel Preview URL to smoke test
        required: true
        type: string

permissions:
  checks: read
  contents: read
  pull-requests: write
  statuses: read

env:
  VERCEL_STATUS_TIMEOUT_SECONDS: 900

jobs:
  preview:
    # Do not expose deployment credentials to pull requests from forks.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Preview protection secret
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET" || { echo "VERCEL_AUTOMATION_BYPASS_SECRET is not configured" >&2; exit 1; }

      - name: Wait for Vercel Git deployment
        id: deploy
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MANUAL_PREVIEW_URL: ${{ inputs.preview_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          deadline=$(( $(date +%s) + VERCEL_STATUS_TIMEOUT_SECONDS ))
          preview_url="$MANUAL_PREVIEW_URL"
          if [ -n "$preview_url" ]; then
            echo "url=$preview_url" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while [ "$(date +%s)" -lt "$deadline" ]; do
            status_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/status")"
            vercel_state="$(printf '%s' "$status_json" | jq -r '.statuses[] | select(.context == "Vercel") | .state' | tail -n 1)"
            if [ "$vercel_state" = "success" ]; then
              preview_url="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate | jq -r '[.[] | select(.user.login == "vercel[bot]") | .body | capture("\\[Preview\\]\\((?<url>https://[^)]+\\.vercel\\.app)\\)").url] | last // empty')"
              if [ -n "$preview_url" ]; then
                break
              fi
            fi
            if [ "$vercel_state" = "failure" ] || [ "$vercel_state" = "error" ]; then
              echo "Vercel Git deployment failed" >&2
              printf '%s\\n' "$status_json" >&2
              exit 1
            fi
            sleep 15
          done
          test -n "$preview_url"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Install Playwright browser
        run: pnpm --filter @fangcun/web exec playwright install --with-deps chromium

      - name: Run preview smoke
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: pnpm test:e2e:preview

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const body = `Fangcun protected Preview Smoke passed: ${process.env.PREVIEW_URL}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
